name: 📖 Web App Documentation
description: For issues with the closed-source side of https://typst.app/docs (things that are not modifiable through https://github.com/typst/typst)
title: Write a short and descriptive title!
labels:
  - docs
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue with Typst's documentation. Did you [take a look](https://github.com/typst/typst/webapp-issues?q=is%3Aopen+is%3Aissue+label%3Adocs) if your issue has already been filed? If so, join the discussion there! Is your issue related to the [reference](https://typst.app/docs/reference/), [guides](https://typst.app/docs/guides/), or [tutorial](https://typst.app/docs/tutorial/) documentation? Please file it [here](https://github.com/typst/issues/issues) instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Please describe your issue.
      placeholder: Terse and specific description of the issue. You can add a screenshot by dragging an image here.
    validations:
      required: true
